<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>射门分析系统 v1.020</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #0d131f; color: #f8fafc; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #131826; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .transition-opacity { transition: opacity 0.2s ease-in-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

<script type="text/babel">
    const { useState, useMemo, useRef, useTransition, useEffect } = React;

    const IconUpload = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    const IconCamera = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>;

    const teamTranslations = {
        'Chengdu Rongcheng': '成都蓉城', 'Shenzhen Peng City': '深圳新鹏城', 'Shandong Taishan': '山东泰山',
        'Liaoning Tieren': '辽宁铁人', 'Tianjin Jinmen Tiger': '天津津门虎', 'Chongqing Tonglianglong': '重庆铜梁龙',
        'Shanghai Shenhua': '上海申花', 'Dalian Yingbo': '大连英博', 'Yunnan Yukun': '云南玉昆',
        'Qingdao Hainiu': '青岛海牛', 'Shanghai Haigang': '上海海港', 'Shanghai Port': '上海海港', 'Henan': '河南队',
        'Zhejiang': '浙江队', 'Qingdao West Coast': '青岛西海岸', 'Wuhan Three Towns': '武汉三镇', 'Beijing Guoan': '北京国安'
    };
    const getTeamName = (en) => teamTranslations[en] || en;

    const parseData = (text) => {
        const lines = text.split('\n');
        const delimiter = lines[0].includes('\t') ? '\t' : ',';
        const headers = lines[0].split(delimiter).map(h => h.trim().toLowerCase());
        const hIdx = {};
        headers.forEach((h, i) => hIdx[h] = i);

        // 探测阶段字段名
        const phaseCol = hIdx['phasetype'];
        const startOfPlayCol = hIdx['startofplay'];
        const breakthroughCol = hIdx['breakthroughball'];

        const matchTeams = {};
        const matchOpponent = {};
        const matchDir = {};
        
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const values = line.split(delimiter);
            const matchid = values[hIdx['matchid']];
            const team = values[hIdx['passer_team']]?.trim();
            const idhalf = values[hIdx['idhalf']]?.trim();
            const phaseStr = phaseCol !== undefined ? (values[phaseCol] || '').trim().toLowerCase() : '';
            const sopStr = startOfPlayCol !== undefined ? (values[startOfPlayCol] || '').trim().toLowerCase() : '';

            if (!matchid || !team) continue;
            if (!matchTeams[matchid]) matchTeams[matchid] = new Set();
            matchTeams[matchid].add(team);

            if (idhalf && (phaseStr.includes('corner') || phaseStr.includes('penalty') || sopStr.includes('corner') || sopStr.includes('penalty'))) {
                const px = parseFloat(values[hIdx['passer_x']]);
                if (!isNaN(px)) {
                    if (!matchDir[matchid]) matchDir[matchid] = {};
                    if (!matchDir[matchid][team]) matchDir[matchid][team] = {};
                    matchDir[matchid][team][idhalf] = px > 0 ? 1 : -1;
                }
            }
        }

        for (const matchid in matchTeams) {
            const teams = Array.from(matchTeams[matchid]);
            if (teams.length >= 2) {
                const t1 = teams[0], t2 = teams[1];
                matchOpponent[`${matchid}_${t1}`] = t2;
                matchOpponent[`${matchid}_${t2}`] = t1;

                if (matchDir[matchid]) {
                    ['1', '2', '3', '4', '5'].forEach(half => {
                        const dir1 = matchDir[matchid][t1]?.[half];
                        const dir2 = matchDir[matchid][t2]?.[half];
                        if (dir1 && !dir2) {
                            if(!matchDir[matchid][t2]) matchDir[matchid][t2] = {};
                            matchDir[matchid][t2][half] = -dir1;
                        } else if (dir2 && !dir1) {
                            if(!matchDir[matchid][t1]) matchDir[matchid][t1] = {};
                            matchDir[matchid][t1][half] = -dir2;
                        }
                    });
                }
            }
        }

        const shots = [];
        const processedShotLines = new Set();

        for (let i = 1; i < lines.length; i++) {
            if (processedShotLines.has(i)) continue;
            
            const line = lines[i].trim();
            if (!line) continue;
            const values = line.split(delimiter);
            
            const eventName = values[hIdx['eventname']]?.trim() || '';
            const eventNameLower = eventName.toLowerCase();
            
            if (!eventNameLower.includes('shot') && eventName !== 'Goal' && eventName !== 'Penalty') continue;

            const matchid = values[hIdx['matchid']];
            const team = values[hIdx['passer_team']]?.trim() || '未知';
            const opponent = matchOpponent[`${matchid}_${team}`] || '未知';
            
            const rawPlayerName = values[hIdx['passer_name']]?.trim() || '未知';
            const rawJersey = values[hIdx['passer_jersey']]?.trim();
            const player = rawJersey && rawJersey !== '' ? `${rawJersey} - ${rawPlayerName}` : rawPlayerName;
            
            // 提前获取半场和进攻方向，用于前置判定传球的目标坐标是否在禁区内
            const rawHalf = values[hIdx['idhalf']]?.trim();
            let attackDir = matchDir[matchid]?.[team]?.[rawHalf];
            if (!attackDir) {
                const tempTx = parseFloat(values[hIdx['targetx']]);
                if (!isNaN(tempTx)) attackDir = tempTx > 0 ? 1 : -1;
                else attackDir = 1;
            }
            
            // ----------------------------------------------------
            // 智能溯源分析 (传中、定位球、运动战、点球)
            // ----------------------------------------------------
            const currentPhase = phaseCol !== undefined ? (values[phaseCol] || '').trim().toLowerCase() : '';
            const startOfPlay = startOfPlayCol !== undefined ? (values[startOfPlayCol] || '').trim().toLowerCase() : '';
            
            let hasCross = false;
            let crossPhaseIsSetPlay = false;
            
            // 向前追溯最多 3 个事件
            for (let k = Math.max(1, i - 3); k < i; k++) {
                const prevLine = lines[k].split(delimiter);
                const prevEvent = (prevLine[hIdx['eventname']] || '').trim().toLowerCase();
                const prevPhase = phaseCol !== undefined ? (prevLine[phaseCol] || '').trim().toLowerCase() : '';
                
                let isCrossAction = false;
                
                // 1. 显式记录为 Cross
                if (prevEvent.includes('cross')) {
                    isCrossAction = true;
                } 
                // 2. 隐式传中判定：基于坐标的 Pass 或 Pass assist
                else if (prevEvent.includes('pass')) {
                    let prevPy = parseFloat(prevLine[hIdx['passer_y']]);
                    
                    let prevTx = parseFloat(prevLine[hIdx['targetx']]);
                    let prevTy = parseFloat(prevLine[hIdx['targety']]);
                    
                    // 修复：传球的落点坐标在数据中可能不在 targetx/targety 列中，
                    // 如果为空，则自动取传球后的下一个动作（如停球或紧接着的射门）的起始坐标作为落点
                    if (isNaN(prevTx) || isNaN(prevTy)) {
                        const nextEvLine = lines[k + 1].split(delimiter);
                        prevTx = parseFloat(nextEvLine[hIdx['passer_x']]);
                        prevTy = parseFloat(nextEvLine[hIdx['passer_y']]);
                    }
                    
                    if (!isNaN(prevPy) && !isNaN(prevTx) && !isNaN(prevTy)) {
                        // 根据进攻方向标准化坐标 (保证进攻方向永远朝向正向 5250)
                        let normPy = attackDir === -1 ? -prevPy : prevPy;
                        let normTx = attackDir === -1 ? -prevTx : prevTx;
                        let normTy = attackDir === -1 ? -prevTy : prevTy;
                        
                        let absStartPy = Math.abs(normPy);
                        let absTargetTy = Math.abs(normTy);
                        
                        // 条件1: 起始点在两侧边路和肋部 (Y坐标正负916到3400之间)
                        let isFromFlank = absStartPy >= 916 && absStartPy <= 3400;
                        
                        // 条件2: 终点在大禁区内 (X:3600到5250距离底线16.5米内, Y:在正负2016内即大禁区宽度内)
                        let isToPenaltyBox = normTx >= 3600 && normTx <= 5250 && absTargetTy <= 2016;
                        
                        if (isFromFlank && isToPenaltyBox) {
                            isCrossAction = true;
                        }
                    }
                }
                
                if (isCrossAction) {
                    hasCross = true;
                    if (prevPhase.includes('setplay')) {
                        crossPhaseIsSetPlay = true;
                    }
                    break;
                }
            }
            
            let source = '运动战'; // 默认
            
            // 1. 点球 (优先级最高)
            if (startOfPlay === 'penalty' || eventNameLower.includes('penalty')) {
                source = '点球';
            } 
            // 2. 定位球
            else if (currentPhase.includes('setplay') || (hasCross && crossPhaseIsSetPlay)) {
                source = '定位球';
            } 
            // 3. 传中与运动战
            else if (currentPhase.includes('openplay')) {
                if (hasCross && !crossPhaseIsSetPlay) {
                    source = '传中';
                } else {
                    source = '运动战';
                }
            }
            // 4. 兜底逻辑 (处理空数据)
            else {
                if (hasCross) {
                    source = crossPhaseIsSetPlay ? '定位球' : '传中';
                } else {
                    const setPieceKeywords = ['goal kick', 'throw in', 'corner', 'direct free-kick', 'indirect free-kick'];
                    let isSetPiece = false;
                    for (let kw of setPieceKeywords) {
                        if (startOfPlay.includes(kw)) {
                            isSetPiece = true;
                            break;
                        }
                    }
                    if (isSetPiece) source = '定位球';
                    else source = '运动战';
                }
            }
            
            const displaySource = source;
            // ----------------------------------------------------
            
            const matchday = parseInt(values[hIdx['matchday']]?.trim()) || 0;
            const rawBp = values[hIdx['bodypart']]?.trim().toLowerCase() || '';
            let bodypart = '-';
            if (rawBp.includes('left')) bodypart = '左脚';
            else if (rawBp === 'foot' || rawBp.includes('right')) bodypart = '右脚';
            else if (rawBp.includes('head') || rawBp.includes('header')) bodypart = '头球';
            else if (rawBp) bodypart = rawBp;
            
            const rawTime = values[hIdx['match_minute']] || '';
            let displayTime = rawTime;
            
            if (rawHalf === '2' && !isNaN(rawTime)) {
                let t = parseInt(rawTime);
                if (t >= 45) {
                    displayTime = `45+${t - 45}`;
                }
            }

            let halfDesc = rawHalf || '-';
            if (rawHalf === '1') halfDesc = '上半场';
            else if (rawHalf === '2') halfDesc = '下半场';
            else if (rawHalf === '3') halfDesc = '加时上半场';
            else if (rawHalf === '4') halfDesc = '加时下半场';

            let rawPx = parseFloat(values[hIdx['passer_x']]);
            let rawPy = parseFloat(values[hIdx['passer_y']]);
            if (isNaN(rawPx) || isNaN(rawPy)) continue;
            
            if (attackDir === -1) {
                rawPx = -rawPx;
                rawPy = -rawPy;
            }
            
            let px = Math.abs(rawPx); 
            // 射门范围裁剪：剔除px小于1418的点（即只显示中圈弧5m外到底线的区域）
            if (px < 1418) continue; 

            let tx = parseFloat(values[hIdx['targetx']]);
            let ty = parseFloat(values[hIdx['targety']]);
            let tz = parseFloat(values[hIdx['targetz']]);
            
            if (attackDir === -1 && !isNaN(tx) && !isNaN(ty)) {
                tx = -tx;
                ty = -ty;
            }
            
            let endSvgX = 340;
            let endSvgY = 0; 
            if (!isNaN(ty)) endSvgX = 340 + (ty / 10);
            
            const svgY = (5250 - px) / 10;
            const svgX = 340 + (rawPy / 10);
            
            let cx = 0; let cy = -100;
            let hasGoalTarget = false;
            let isGoal = eventName === 'Goal';
            let isIntercepted = false;
            let isOutForGoalKick = false;
            
            let isOnTarget = eventNameLower.includes('shot on target') || isGoal;
            
            // 扫描后续事件检测进球
            for (let j = i + 1; j < Math.min(i + 4, lines.length); j++) {
                if (processedShotLines.has(j)) continue;

                const nextLine = lines[j].split(delimiter);
                const nextEvent = nextLine[hIdx['eventname']]?.trim();
                const nextTeam = nextLine[hIdx['passer_team']]?.trim();
                const nextPlayer = nextLine[hIdx['passer_name']]?.trim();

                // 检测进球
                if (nextEvent === 'Goal') { 
                    isGoal = true; 
                    isOnTarget = true; 
                    processedShotLines.add(j); 
                    break; 
                }
                if (nextTeam === team && nextPlayer === rawPlayerName && (nextEvent?.toLowerCase().includes('shot') || nextEvent === 'Penalty')) {
                    processedShotLines.add(j);
                    continue;
                }
            }
            
            // 检测下一行的 Block 和 Out for goal kick
            if (!isGoal && i + 1 < lines.length) {
                const nextLine = lines[i + 1].split(delimiter);
                const nextEvent = (nextLine[hIdx['eventname']] || '').trim();
                const nextEventLower = nextEvent.toLowerCase();
                
                if (['Reception', 'Block', 'Clearance', 'Pass'].includes(nextEvent)) {
                    isIntercepted = true;
                    isOnTarget = false;
                    hasGoalTarget = true;
                    let bx = parseFloat(nextLine[hIdx['passer_x']]);
                    let by = parseFloat(nextLine[hIdx['passer_y']]);
                    if (!isNaN(bx) && !isNaN(by)) {
                        if (attackDir === -1) { bx = -bx; by = -by; }
                        endSvgY = (5250 - Math.abs(bx)) / 10;
                        endSvgX = 340 + (by / 10);
                    }
                } else if (nextEventLower === 'out for goal kick' || nextEventLower.includes('out for goal kick')) {
                    isOutForGoalKick = true;
                    isIntercepted = false;
                    isOnTarget = false;
                    hasGoalTarget = true;
                    endSvgY = 0; // 底线 5250 cm => svgY 0
                    if (!isNaN(ty)) endSvgX = 340 + (ty / 10);
                }
            }
            
            if (isGoal) isOnTarget = true;

            if (!isNaN(ty) && !isNaN(tz)) {
                hasGoalTarget = true;
                cx = ty; 
                cy = 244 - tz;
                if (!isOnTarget && !isOutForGoalKick && !isIntercepted && cx >= -366 && cx <= 366 && cy >= 0 && cy <= 244) {
                    const distTop = cy; 
                    const distLeft = cx - (-366);
                    const distRight = 366 - cx;
                    const minEdge = Math.min(distTop, distLeft, distRight);
                    if (minEdge === distTop) cy = -15;
                    else if (minEdge === distLeft) cx = -385;
                    else cx = 385;
                }
            }

            let depth = 'Far';
            if (svgY <= 55 && svgX >= 248.4 && svgX <= 431.6) {
                depth = 'Near';
            } else if (svgY <= 165 && svgX >= 138.4 && svgX <= 541.6) {
                // 计算大禁区内绿色的Mid梯形区域的边界
                const leftBoundary = 138.4 + (128.475 / 165) * svgY;
                const rightBoundary = 541.6 - (128.475 / 165) * svgY;
                if (svgX > leftBoundary && svgX < rightBoundary) {
                    depth = 'Mid';
                } else {
                    // 大禁区两侧的两个三角形区域划分为 Far
                    depth = 'Far'; 
                }
            }

            const slope = svgY === 0 ? 0 : (svgX - 340) / svgY;
            let lane = 'Center';
            if (slope < -1.2218) lane = 'Left';
            else if (slope < -0.4431) lane = 'LeftCenter';
            else if (slope <= 0.4431) lane = 'Center';
            else if (slope <= 1.2218) lane = 'RightCenter';
            else lane = 'Right';

            shots.push({
                id: `shot-${i}`, team: getTeamName(team), opponent: getTeamName(opponent), player, matchday, 
                source, displaySource, bodypart, displayTime, halfDesc, isGoal, isOnTarget, svgX, svgY, endSvgX, endSvgY, hasGoalTarget, isIntercepted, cx, cy, depth, lane
            });
            
            processedShotLines.add(i);
        }
        return shots;
    };

    const App = () => {
        const [data, setData] = useState([]);
        const [isFetchingCloud, setIsFetchingCloud] = useState(true);
        const [fetchError, setFetchError] = useState(null);
        const [filters, setFilters] = useState({ source: '全部', team: '全部', player: '全部', matchdayRange: '', result: '全部结果' });
        const [localMatchday, setLocalMatchday] = useState('');
        
        const [showStats, setShowStats] = useState(false);
        const [showZonePercent, setShowZonePercent] = useState(false);
        const [showShots, setShowShots] = useState(true); 
        
        const [hoveredShot, setHoveredShot] = useState(null);
        
        const [isPending, startTransition] = useTransition();

        const fileInputRef = useRef(null);
        const pitchRef = useRef(null);
        const goalRef = useRef(null);

        useEffect(() => {
            const fetchCloudData = async () => {
                setIsFetchingCloud(true);
                setFetchError(null);
                try {
                    const response = await fetch('https://zkkqvwldaehffzqwbpcu.supabase.co/storage/v1/object/public/opta-data/OPTA_Filtered_Shots.csv');
                    if (response.ok) {
                        const text = await response.text();
                        setData(parseData(text));
                    } else {
                        console.error("加载云端数据失败，状态码:", response.status);
                        setFetchError(`HTTP ${response.status}`);
                    }
                } catch (error) {
                    console.error("请求云端数据出错:", error);
                    setFetchError(error.message);
                } finally {
                    setIsFetchingCloud(false);
                }
            };
            fetchCloudData();
        }, []);

        const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => setData(parseData(event.target.result));
                reader.readAsText(file);
            }
        };

        const updateFilter = (key, value) => {
            startTransition(() => {
                setFilters(prev => ({ ...prev, [key]: value }));
            });
        };

        const exportImage = (elementId, name, bgColor = '#1b2236') => {
            const el = document.getElementById(elementId);
            if (el) {
                html2canvas(el, { backgroundColor: bgColor, scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `${name}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                });
            }
        };

        const { teams, players, filteredData } = useMemo(() => {
            if (data.length === 0) return { teams: [], players: [], filteredData: [] };

            const applyBaseFilters = (dataset) => {
                let res = dataset;
                if (filters.source !== '全部') res = res.filter(d => d.source === filters.source);
                if (filters.team !== '全部') res = res.filter(d => d.team === filters.team);
                if (filters.result === '进球') res = res.filter(d => d.isGoal);
                else if (filters.result === '射正') res = res.filter(d => d.isOnTarget);
                else if (filters.result === '射偏') res = res.filter(d => !d.isOnTarget);
                
                if (filters.matchdayRange) {
                    const rangeParts = filters.matchdayRange.split('-');
                    const sMd = parseInt(rangeParts[0]);
                    const eMd = rangeParts.length > 1 ? parseInt(rangeParts[1]) : sMd;
                    if (!isNaN(sMd)) {
                        res = res.filter(d => {
                            const m = parseInt(d.matchday);
                            if (isNaN(m)) return false;
                            if (!isNaN(eMd)) return m >= sMd && m <= eMd;
                            return m === sMd;
                        });
                    }
                }
                return res;
            };

            const baseDataForPlayers = applyBaseFilters(data);

            const playerCounts = {};
            baseDataForPlayers.forEach(d => {
                playerCounts[d.player] = (playerCounts[d.player] || 0) + 1;
            });
            const currentPlayers = Object.keys(playerCounts).sort((a, b) => playerCounts[b] - playerCounts[a]);

            let finalData = baseDataForPlayers;
            if (filters.player !== '全部') {
                finalData = finalData.filter(d => d.player === filters.player);
            }

            const currentTeams = Array.from(new Set(data.map(d => d.team))).sort();

            return { teams: currentTeams, players: currentPlayers, filteredData: finalData };
        }, [data, filters]);

        useEffect(() => {
            if (filters.player !== '全部' && players.length > 0 && !players.includes(filters.player)) {
                updateFilter('player', '全部');
            }
        }, [players, filters.player]);

        const zoneStats = useMemo(() => {
            const stats = {};
            ['Near', 'Mid', 'Far'].forEach(d => {
                ['Left', 'LeftCenter', 'Center', 'RightCenter', 'Right'].forEach(l => {
                    stats[`${d}-${l}`] = { shots: 0, goals: 0 };
                });
            });
            filteredData.forEach(d => {
                const key = `${d.depth}-${d.lane}`;
                if (stats[key]) {
                    stats[key].shots++;
                    if (d.isGoal) stats[key].goals++;
                }
            });
            return stats;
        }, [filteredData]);

        const hoveredData = hoveredShot?.id ? filteredData.find(s => s.id === hoveredShot.id) : null;

        const zc = {
            'Near-Left': { x: 265, y: 25 }, 'Near-LeftCenter': { x: 305, y: 25 }, 'Near-Center': { x: 340, y: 25 }, 'Near-RightCenter': { x: 375, y: 25 }, 'Near-Right': { x: 415, y: 25 },
            'Mid-Left': { x: 220, y: 65 }, 'Mid-LeftCenter': { x: 260, y: 110 }, 'Mid-Center': { x: 340, y: 120 }, 'Mid-RightCenter': { x: 420, y: 110 }, 'Mid-Right': { x: 460, y: 65 },
            'Far-Left': { x: 65, y: 160 }, 'Far-LeftCenter': { x: 160, y: 260 }, 'Far-Center': { x: 340, y: 280 }, 'Far-RightCenter': { x: 520, y: 260 }, 'Far-Right': { x: 615, y: 160 },
        };
        
        const zLbl = {
            'Near-Left': '近', 'Near-LeftCenter': '近', 'Near-Center': '近', 'Near-RightCenter': '近', 'Near-Right': '近',
            'Mid-Left': '中', 'Mid-LeftCenter': '中', 'Mid-Center': '中', 'Mid-RightCenter': '中', 'Mid-Right': '中',
            'Far-Left': '远', 'Far-LeftCenter': '远', 'Far-Center': '远', 'Far-RightCenter': '远', 'Far-Right': '远'
        };

        const renderShotMarker = (d, isHovered, isGoalView = false, activePanel = null) => {
            const cx = isGoalView ? d.cx : d.svgX;
            const cy = isGoalView ? d.cy : d.svgY;
            const hitRadius = isGoalView ? 24 : 16;
            
            const currentRenderPanel = isGoalView ? 'goal' : 'pitch';
            const isRemoteHover = isHovered && activePanel && activePanel !== currentRenderPanel;
            
            const hoverScale = isRemoteHover ? 2.5 : 1.4;
            const scale = isHovered ? hoverScale : 1;
            
            const starPathSmall = "M 0 -7 L 2 -2.2 L 7 -2.2 L 3 0.9 L 4.5 5.6 L 0 2.8 L -4.5 5.6 L -3 0.9 L -7 -2.2 L -2 -2.2 Z";
            const starPathLarge = "M 0 -10.5 L 3 -3.3 L 10.5 -3.3 L 4.5 1.35 L 6.75 8.4 L 0 4.2 L -6.75 8.4 L -4.5 1.35 L -10.5 -3.3 L -3 -3.3 Z";

            let markerShape;
            if (d.isGoal) {
                markerShape = <path d={isHovered ? starPathLarge : starPathSmall} transform={`translate(${cx}, ${cy}) scale(${scale})`} fill="#fcd34d" stroke="#ffffff" strokeWidth={isHovered ? 2 : 1.5} className="pointer-events-none drop-shadow" />;
            } else if (d.isOnTarget) {
                markerShape = <circle cx={cx} cy={cy} r={4.5 * scale} fill="#ef4444" stroke="#fcd34d" strokeWidth={isHovered ? 2 : 1.2} className="pointer-events-none drop-shadow-sm" />;
            } else {
                markerShape = <circle cx={cx} cy={cy} r={4.5 * scale} fill="#1e293b" stroke="#fcd34d" strokeWidth={isHovered ? 2 : 1.2} className="pointer-events-none drop-shadow-sm" />;
            }

            const xOffset = isHovered ? 6 : 3.5;
            const xPath = `M ${cx - xOffset} ${cy - xOffset} L ${cx + xOffset} ${cy + xOffset} M ${cx - xOffset} ${cy + xOffset} L ${cx + xOffset} ${cy - xOffset}`;

            let nameLabel = null;
            if (isHovered) {
                const labelYOffset = isGoalView ? 22 : 18;
                nameLabel = (
                    <text x={cx} y={cy - labelYOffset * scale} 
                          fill="#ffffff" fontSize="12" fontWeight="bold" textAnchor="middle" 
                          className="pointer-events-none" style={{textShadow: "0px 1px 3px rgba(0,0,0,0.8)"}}>
                        {d.player}
                    </text>
                );
            }

            return (
                <g key={d.id}>
                    {isRemoteHover && (
                        <circle cx={cx} cy={cy} r={hitRadius * 0.8} fill="none" stroke="#38bdf8" strokeWidth="2.5" className="pointer-events-none">
                            <animate attributeName="r" values={`${hitRadius * 0.8};${hitRadius * 2.5}`} dur="1.2s" repeatCount="indefinite" />
                            <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite" />
                        </circle>
                    )}
                    
                    {markerShape}
                    
                    {!isGoalView && d.isIntercepted && (
                        <path d={xPath} stroke="#ffffff" strokeWidth={isHovered ? 2 : 1.2} className="pointer-events-none drop-shadow-sm" />
                    )}
                    
                    {nameLabel}
                    
                    <circle cx={cx} cy={cy} r={hitRadius} fill="transparent" className="cursor-pointer"
                            onMouseEnter={() => setHoveredShot({ id: d.id, panel: currentRenderPanel })} 
                            onMouseLeave={() => setHoveredShot(null)} />
                </g>
            );
        };

        return (
            <div className="min-h-screen p-6 flex flex-col items-center bg-[#0d131f]">
                
                {/* Header & Controls */}
                <div className="w-full max-w-[1500px] flex justify-between items-center mb-6">
                    <h1 className="text-2xl font-bold text-slate-100 flex items-center gap-4">
                        射门分析系统
                        {isPending && <span className="text-xs font-normal text-sky-400 animate-pulse bg-slate-800 px-2 py-1 rounded">正在渲染...</span>}
                    </h1>
                    <div className="flex items-center gap-5">
                        <label className="flex items-center gap-1.5 cursor-pointer text-slate-300 text-sm font-medium hover:text-white transition-colors">
                            <input type="checkbox" checked={showShots} onChange={(e) => setShowShots(e.target.checked)} className="accent-sky-500 w-4 h-4 cursor-pointer" />
                            显示射门落点
                        </label>
                        <div className="w-px h-5 bg-slate-700"></div>
                        <label className="flex items-center gap-1.5 cursor-pointer text-slate-300 text-sm font-medium hover:text-white transition-colors">
                            <input type="checkbox" checked={showStats} onChange={(e) => setShowStats(e.target.checked)} className="accent-sky-500 w-4 h-4 cursor-pointer" />
                            显示区域统计
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer text-slate-300 text-sm font-medium hover:text-white transition-colors">
                            <input type="checkbox" checked={showZonePercent} onChange={(e) => setShowZonePercent(e.target.checked)} className="accent-emerald-500 w-4 h-4 cursor-pointer" />
                            显示区域占比
                        </label>
                        <div className="w-px h-5 bg-slate-700"></div>
                        <input type="file" accept=".csv,.txt" onChange={handleFileUpload} ref={fileInputRef} className="hidden" />
                        <button onClick={() => fileInputRef.current.click()} className="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-md flex items-center gap-2 text-sm transition-colors shadow">
                            <IconUpload /> 本地导入
                        </button>
                    </div>
                </div>

                {data.length === 0 ? (
                    <div className="text-center py-40 text-slate-500 w-full max-w-[1500px] border-2 border-slate-700/50 border-dashed rounded-xl bg-[#1b2236]/30">
                        {isFetchingCloud ? (
                            <div className="flex flex-col items-center">
                                <svg className="animate-spin h-8 w-8 text-sky-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <h2 className="text-xl font-medium mb-2 text-sky-400">正在从云端加载赛事数据...</h2>
                                <p className="text-sm text-slate-400">请求连接 Supabase，请稍候</p>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center">
                                <svg className="w-12 h-12 text-rose-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                <h2 className="text-xl font-medium mb-2 text-rose-400">云端数据加载失败</h2>
                                {fetchError && <p className="text-sm text-rose-300/80 mb-4 bg-rose-500/10 px-3 py-1.5 rounded">错误详情: {fetchError}</p>}
                                <p className="text-sm text-slate-300 mb-2">原因可能是您的 Supabase 免费项目因长时间未活跃被暂停，或遭遇跨域(CORS)拦截。</p>
                                <p className="text-sm text-slate-400">请点击右上角 <strong className="text-sky-400 flex items-center inline-flex gap-1 bg-sky-900/40 px-1.5 py-0.5 rounded"><IconUpload /> 本地导入</strong> 按钮手动上传 CSV 数据文件。</p>
                            </div>
                        )}
                    </div>
                ) : (
                    <div className="w-full max-w-[1500px] flex flex-col gap-6">
                        
                        {/* Filters Bar */}
                        <div className="bg-[#1b2236] p-4 rounded-xl border border-slate-700/50 shadow flex items-center justify-between">
                            <div className="flex items-end gap-5 flex-1 flex-wrap">
                                <div className="flex flex-col gap-1.5 w-40">
                                    <label className="text-xs font-medium text-slate-400 pl-1">来源类型</label>
                                    <select className="bg-[#0d131f] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 outline-none focus:border-sky-500 transition-colors" 
                                            value={filters.source} onChange={(e) => updateFilter('source', e.target.value)}>
                                        <option value="全部">全部来源</option>
                                        <option value="运动战">运动战</option>
                                        <option value="定位球">定位球</option>
                                        <option value="传中">传中</option>
                                        <option value="点球">点球</option>
                                    </select>
                                </div>
                                <div className="flex flex-col gap-1.5 w-48">
                                    <label className="text-xs font-medium text-slate-400 pl-1">球队</label>
                                    <select className="bg-[#0d131f] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 outline-none focus:border-sky-500 transition-colors" 
                                            value={filters.team} onChange={(e) => updateFilter('team', e.target.value)}>
                                        <option value="全部">全部球队</option>
                                        {teams.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                                <div className="flex flex-col gap-1.5 w-48">
                                    <label className="text-xs font-medium text-slate-400 pl-1">球员</label>
                                    <select className="bg-[#0d131f] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 outline-none focus:border-sky-500 transition-colors" 
                                            value={filters.player} onChange={(e) => updateFilter('player', e.target.value)}>
                                        <option value="全部">全部球员</option>
                                        {players.map(p => <option key={p} value={p}>{p}</option>)}
                                    </select>
                                </div>
                                <div className="flex flex-col gap-1.5 w-32">
                                    <label className="text-xs font-medium text-slate-400 pl-1">射门结果</label>
                                    <select className="bg-[#0d131f] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 outline-none focus:border-sky-500 transition-colors" 
                                            value={filters.result} onChange={(e) => updateFilter('result', e.target.value)}>
                                        <option value="全部结果">全部结果</option>
                                        <option value="进球">仅进球</option>
                                        <option value="射正">射正 (含进球)</option>
                                        <option value="射偏">射偏</option>
                                    </select>
                                </div>
                                <div className="flex flex-col gap-1.5 w-32">
                                    <label className="text-xs font-medium text-slate-400 pl-1">轮次区间</label>
                                    <input type="text" placeholder="如 18 或 1-5" 
                                           className="bg-[#0d131f] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 outline-none focus:border-sky-500 transition-colors text-center" 
                                           value={localMatchday} onChange={(e) => {
                                               setLocalMatchday(e.target.value);
                                               updateFilter('matchdayRange', e.target.value);
                                           }} />
                                </div>
                            </div>
                            <div className="flex flex-col items-center justify-center pl-8 border-l border-slate-700/50 min-w-[120px]">
                                <span className="text-xs font-medium text-slate-400 mb-1">总射门数</span>
                                <span className="text-3xl font-black text-emerald-400 leading-none">{filteredData.length}</span>
                            </div>
                        </div>

                        <div className={`grid grid-cols-1 xl:grid-cols-2 gap-6 transition-opacity ${isPending ? 'opacity-50' : 'opacity-100'}`}>
                            
                            {/* 2D Pitch Panel */}
                            <div className="bg-[#1b2236] rounded-xl border border-slate-700/50 shadow-2xl overflow-hidden flex flex-col relative" ref={pitchRef}>
                                <div className="px-5 border-b border-slate-700/50 flex items-center bg-transparent z-20 h-[72px] shrink-0">
                                    <h3 className="font-bold text-slate-100 text-lg mr-3">射门分布</h3>
                                    <button onClick={() => exportImage('pitch-svg-area', `${filters.player}_${filters.source}`)} className="text-slate-400 hover:text-white p-1.5 rounded-lg transition-colors bg-[#232b42] border border-slate-600/50 shrink-0" title="导出场区图">
                                        <IconCamera />
                                    </button>
                                    
                                    <div className="flex-1 ml-6 h-[50px] flex items-center justify-end">
                                        {hoveredData && (
                                            <div className="flex items-center gap-3.5 bg-[#131826] px-5 py-1.5 rounded-lg border border-slate-700/80 text-sm h-full shadow-lg animate-[fadeIn_0.15s_ease-out]">
                                                <div className="flex flex-col text-[11px] leading-tight font-bold text-sky-400">
                                                    <span>第{hoveredData.matchday}</span>
                                                    <span>轮</span>
                                                </div>
                                                <div className="w-px h-6 bg-slate-700"></div>
                                                <div className="text-sky-400 font-bold text-[13px] whitespace-nowrap min-w-[100px] flex items-center">
                                                    {hoveredData.player}
                                                </div>
                                                <div className="w-px h-6 bg-slate-700"></div>
                                                <div className="text-slate-200 text-[12px] whitespace-nowrap">
                                                    vs {hoveredData.opponent}
                                                </div>
                                                <div className="w-px h-6 bg-slate-700"></div>
                                                <div className="text-[#a5f0b5] font-medium text-[12px] whitespace-nowrap flex flex-col leading-tight justify-center">
                                                    {hoveredData.displaySource}
                                                </div>
                                                <div className="w-px h-6 bg-slate-700"></div>
                                                <div className="text-slate-300 text-[12px] whitespace-nowrap flex flex-col leading-tight justify-center mt-1">
                                                    {hoveredData.bodypart}
                                                </div>
                                                <div className="w-px h-6 bg-slate-700"></div>
                                                <div className="flex flex-col text-[11px] leading-tight text-slate-300 whitespace-nowrap">
                                                    <span>{hoveredData.halfDesc}</span>
                                                    <span>{hoveredData.displayTime}</span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                
                                <div id="pitch-svg-area" className="p-6 relative flex-grow flex items-center justify-center bg-[#1b2236] rounded-b-xl">
                                    <svg viewBox="-40 -40 760 470" className="w-full h-auto max-w-2xl">
                                        <rect x="-40" y="-40" width="760" height="470" fill="#71a2f9" />
                                        
                                        {/* Mid Green Polygon (梯形区域) */}
                                        <polygon points="138.4,0 541.6,0 413.125,165 266.875,165" fill="#a0f2aa" />
                                        
                                        {/* Near Blue Rect (覆盖在绿色之上，使其和Far区颜色一致) */}
                                        <rect x="248.4" y="0" width="183.2" height="55" fill="#71a2f9" />

                                        {/* Pitch Outlines (高度缩短至 383.2) */}
                                        <rect x="0" y="0" width="680" height="383.2" stroke="#ffffff" strokeWidth="1.5" fill="none" opacity="0.9" />
                                        <rect x="138.4" y="0" width="403.2" height="165" stroke="#ffffff" strokeWidth="1.5" fill="none" opacity="0.9" />
                                        <rect x="248.4" y="0" width="183.2" height="55" stroke="#ffffff" strokeWidth="1.5" fill="none" opacity="0.9" />
                                        <path d="M 266.875 165 A 91.5 91.5 0 0 0 413.125 165" stroke="#ffffff" strokeWidth="1.5" fill="none" opacity="0.9" />
                                        <circle cx="340" cy="110" r="2.5" fill="#ffffff" />
                                        
                                        <rect x="303.4" y="-15" width="73.2" height="15" stroke="#ffffff" strokeWidth="1.5" fill="none" opacity="0.9" />
                                        
                                        {/* 原始 4 条发散的射线 (底部裁剪至 383.2) */}
                                        <path d="M 340 0 L 0 278.2" stroke="#1e293b" strokeWidth="1" fill="none" opacity="0.75" />
                                        <path d="M 340 0 L 170.18 383.2" stroke="#1e293b" strokeWidth="1" fill="none" opacity="0.75" />
                                        <path d="M 340 0 L 509.82 383.2" stroke="#1e293b" strokeWidth="1" fill="none" opacity="0.75" />
                                        <path d="M 340 0 L 680 278.2" stroke="#1e293b" strokeWidth="1" fill="none" opacity="0.75" />

                                        {/* 新增：划分大禁区内 Far 远射三角区的分割线 */}
                                        <line x1="138.4" y1="0" x2="266.875" y2="165" stroke="#1e293b" strokeWidth="1" opacity="0.75" />
                                        <line x1="541.6" y1="0" x2="413.125" y2="165" stroke="#1e293b" strokeWidth="1" opacity="0.75" />

                                        {showShots && hoveredData && hoveredData.hasGoalTarget && (
                                            <line x1={hoveredData.svgX} y1={hoveredData.svgY} x2={hoveredData.endSvgX} y2={hoveredData.endSvgY} 
                                                  stroke="#facc15" strokeWidth="2.5" opacity="0.9" 
                                                  strokeDasharray={hoveredData.isIntercepted ? "6 4" : "none"}
                                                  className="pointer-events-none drop-shadow-sm" />
                                        )}

                                        {showShots && filteredData.filter(d => d.id !== hoveredShot?.id).map((d) => renderShotMarker(d, false, false, hoveredShot?.panel))}
                                        {showShots && hoveredData && renderShotMarker(hoveredData, true, false, hoveredShot?.panel)}

                                        {/* 标签放在最后渲染，确保在最顶层且不阻挡鼠标事件 */}
                                        {Object.keys(zc).map(key => {
                                            const pos = zc[key];
                                            return (
                                                <g key={`lbl-${key}`} className="pointer-events-none">
                                                    <text x={pos.x} y={pos.y} fill="#111827" fontSize="13" fontWeight="bold" textAnchor="middle">{zLbl[key]}</text>
                                                    {showStats && (
                                                        <text x={pos.x} y={pos.y + 16} fill="#111827" fontSize="12" fontWeight="bold" textAnchor="middle">
                                                            {zoneStats[key].goals}/{zoneStats[key].shots}
                                                        </text>
                                                    )}
                                                    {showZonePercent && filteredData.length > 0 && (
                                                        (() => {
                                                            const pct = Math.round((zoneStats[key].shots / filteredData.length) * 100);
                                                            if (pct > 0) {
                                                                const txtY = pos.y + (showStats ? 31 : 16);
                                                                return (
                                                                    <g key={`pct-${key}`}>
                                                                        <rect x={pos.x - 14} y={txtY - 11} width="28" height="15" fill="#ffffff" rx="3" opacity="0.85" />
                                                                        <text x={pos.x} y={txtY} fill="#111827" fontSize="11" fontWeight="bold" textAnchor="middle">
                                                                            {pct}%
                                                                        </text>
                                                                    </g>
                                                                );
                                                            }
                                                            return null;
                                                        })()
                                                    )}
                                                </g>
                                            )
                                        })}
                                    </svg>
                                </div>
                            </div>

                            {/* 3D Goal Panel */}
                            <div className="bg-[#1b2236] rounded-xl border border-slate-700/50 shadow-2xl overflow-hidden flex flex-col h-full relative" ref={goalRef}>
                                <div className="px-5 border-b border-slate-700/50 flex items-center bg-transparent z-20 h-[72px] shrink-0">
                                    <h3 className="font-bold text-slate-100 text-lg mr-3">球门落点</h3>
                                    <button onClick={() => exportImage('goal-svg-area', `${filters.player}_${filters.source}_球门`)} className="text-slate-400 hover:text-white p-1.5 rounded-lg transition-colors bg-[#232b42] border border-slate-600/50 shrink-0" title="导出落点图">
                                        <IconCamera />
                                    </button>
                                </div>
                                
                                <div id="goal-svg-area" className="p-6 relative flex-grow flex items-center justify-center bg-[#1b2236] rounded-b-xl">
                                    <svg viewBox="-600 -300 1200 650" className="w-full h-auto overflow-visible max-w-3xl">
                                        <line x1="-600" y1="244" x2="600" y2="244" stroke="#4ade80" strokeWidth="2.5" />
                                        <path d="M -366 244 L -366 0 L 366 0 L 366 244" stroke="#ffffff" strokeWidth="12" fill="none" />
                                        
                                        <line x1="-122" y1="0" x2="-122" y2="244" stroke="#64748b" strokeWidth="1.5" strokeDasharray="6 6" opacity="0.6" />
                                        <line x1="122" y1="0" x2="122" y2="244" stroke="#64748b" strokeWidth="1.5" strokeDasharray="6 6" opacity="0.6" />
                                        <line x1="-366" y1="81.3" x2="366" y2="81.3" stroke="#64748b" strokeWidth="1.5" strokeDasharray="6 6" opacity="0.6" />
                                        <line x1="-366" y1="162.6" x2="366" y2="162.6" stroke="#64748b" strokeWidth="1.5" strokeDasharray="6 6" opacity="0.6" />

                                        {showShots && filteredData.filter(d => d.hasGoalTarget && !d.isIntercepted && d.id !== hoveredShot?.id).map((d) => renderShotMarker(d, false, true, hoveredShot?.panel))}
                                        {showShots && hoveredData && hoveredData.hasGoalTarget && !hoveredData.isIntercepted && renderShotMarker(hoveredData, true, true, hoveredShot?.panel)}
                                    </svg>
                                </div>
                            </div>

                        </div>
                    </div>
                )}
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
